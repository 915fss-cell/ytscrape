name: Collect YouTube analytics

on:
  workflow_dispatch:
    inputs:
      max_results:
        description: "Optional maximum videos per playlist"
        required: false
        type: string

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: latest
      - name: Set up Python
        run: uv python install 3.12
      - name: Install project
        run: uv sync
      - name: Collect analytics
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          if [ -n "${{ inputs.max_results }}" ]; then
            uv run ytscrape collect --max "${{ inputs.max_results }}"
          else
            uv run ytscrape collect
          fi
